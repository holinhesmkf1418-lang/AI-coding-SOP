step = 3
name = 代码审计与重构
content =
    提示词 ③ 代码审计与重构（03-AI编程-代码审计与重构）
    用途：随时调用。AI 初版跑通不代表能用，用它做审计重构。
    核心审计目标与 AI 常见陷阱排查清单（Audit Pillars & AI Anti-Pattern Checklist）
    你必须系统性地排查以下 AI 编程中极易出现的典型缺陷，并严格按照指定的优化方向执行重构：
    1. 结构与模块化坍塌（Structural & Modularity Anti-Patterns）
    • 风险点（AI 常犯）：巨石代码 (God Objects) 与超长文件。为了单次输出省事，将所有逻辑堆砌在单个文件中（如超过 400-500 行的 Vue 组件或庞大的 Python 服务类）。
    • 重构方向：强制实施 DDD 与模块化拆分。前端——将复杂大组件拆分为单一职责的精简子组件，视图层与逻辑层彻底分离，复杂状态管理必须抽离至 composables 或 stores；后端——严格遵循 Controller (Router) -> Service (业务逻辑) -> Repository (数据操作) 的分层架构。
    2. 零硬编码与幻觉隔离（Zero Hardcoding & Hallucination Prevention）
    • 风险点（AI 常犯）：规则硬编码、生造依赖与重复造轮子。将正则、状态字典、业务阈值直接写死在逻辑流中；或者无视项目已存在的公共 utils，自行编造重复的工具函数甚至引入不存在的第三方库。
    • 重构方向：绝对配置化。将所有业务规则、正则、状态值剥离至全局配置表、数据库或环境变量；修改前必须全局检索项目上下文，强制复用现有的基础架构代码（如统一的请求封装、缓存类）。
    3. 逻辑短路与伪容错（Logic Deficits & Fake Fault Tolerance）
    • 风险点（AI 常犯）：掩耳盗铃式的异常处理。滥用裸 try-catch 或 except Exception as e: pass，遇到未预见的数据结构时用空值 (None/null) 敷衍兜底，导致真实的底层错误被吞噬，系统带病运行。
    • 重构方向：移除所有静默失败逻辑。建立显式、精确的错误冒泡与捕获机制，异常必须抛出至顶层并记录；强制在全链路流转节点使用强校验（如 Pydantic v2 / Zod），在边界处就阻断脏数据。
    4. 数据层级与状态失控（Data Scope & State Loss）
    • 风险点（AI 常犯）：范围泄露 (Scope Leakage) 与响应式断裂。在处理多级解析或树状嵌套数据时，为图简便直接丢弃层级关系或父级物理标识；在 Vue 3 中错误地解构 props 导致失去响应式。
    • 重构方向：数据层——强制保留并校验所有数据层级标识（如单元/分部工程关联），执行合并而非覆盖，确保底层数据的绝对完整；状态层——严格遵循 Vue 3 响应式最佳实践，正确使用 toRefs、computed 保持数据流单向且可追溯。
    5. 性能陷阱与并发灾难（Performance & Concurrency Traps）
    • 风险点（AI 常犯）：阻塞式异步与 N+1 灾难。在 FastAPI 等异步框架的协程中运行重型 CPU 计算或同步 I/O；在循环内部执行数据库查询或向 LLM 发起 API 请求。
    • 重构方向：核心事件循环必须保持非阻塞（CPU 密集型任务需交由 asyncio.to_thread 或后台 Worker 处理）；强制将循环内的单次查询重构为批量查询 (Batch Query) 或流式批处理，对于高频 LLM 请求，必须引入语义缓存或 Context Caching 机制。

